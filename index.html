<!DOCTYPE HTML>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Veggie World - 世界中の人と楽しむメルヘン農園ゲーム</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍓</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Inter', sans-serif;
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 1.2s ease;
      overflow-x: hidden;
    }

    /* 天気に応じた背景グラデーション（ふわっと可愛いパステルメルヘン調） */
    body.weather-sunny {
      background: linear-gradient(135deg, #fff0f5 0%, #f0fff4 50%, #fffbe6 100%);
    }
    body.weather-rainy {
      background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #f0fdf4 100%);
    }
    body.weather-rainbow {
      background: linear-gradient(135deg, #ffe4e6 0%, #fef9c3 35%, #dcfce7 70%, #e0f2fe 100%);
    }

    /* 畑のタイルデザイン（ぷっくりチョコ＆キャラメル風） */
    .farm-plot {
      background: radial-gradient(circle at 35% 30%, #a1887f 0%, #795548 100%);
      border: 4px solid #f8bbd0;
      box-shadow: inset 0 6px 10px rgba(62, 39, 35, 0.35), 0 6px 12px rgba(244, 143, 177, 0.25);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }
    .farm-plot:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: inset 0 6px 10px rgba(62, 39, 35, 0.35), 0 12px 20px rgba(244, 143, 177, 0.4);
    }
    .farm-plot:active {
      transform: translateY(1px) scale(0.97);
    }
    .farm-plot.unplowed {
      background: repeating-linear-gradient(45deg, #a1887f, #a1887f 10px, #8d6e63 10px, #8d6e63 20px);
      border-color: #d7ccc8;
    }
    .farm-plot.watered {
      background: radial-gradient(circle at 35% 30%, #6d4c41 0%, #4e342e 100%);
      border-color: #81d4fa;
    }
    .farm-plot.dry {
      background: radial-gradient(circle at 35% 30%, #d7ccc8 0%, #a1887f 100%);
      border-color: #ffcc80;
    }
    .farm-plot.withered {
      background: radial-gradient(circle at center, #616161 0%, #424242 100%);
      border-color: #f48fb1;
    }

    /* ぷにぷに揺れる可愛いアニメーション */
    @keyframes cuteWiggle {
      0%, 100% { transform: translateY(0) rotate(-3deg) scale(1); }
      50% { transform: translateY(-6px) rotate(3deg) scale(1.07); }
    }
    .animate-crop {
      animation: cuteWiggle 2s infinite ease-in-out;
    }

    @keyframes readyGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 183, 77, 0.9)); transform: scale(1.08) rotate(-5deg); }
      50% { filter: drop-shadow(0 0 20px rgba(240, 98, 146, 0.95)); transform: scale(1.22) rotate(5deg); }
    }
    .animate-ready {
      animation: readyGlow 1.1s infinite ease-in-out;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { opacity: 1; transform: translateY(-25px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-50px) scale(1); }
    }
    .floating-text {
      animation: floatUp 1.1s ease-out forwards;
      pointer-events: none;
    }

    /* ぷるんっ！バウンス効果 */
    @keyframes squishyPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.22, 0.82); }
      55% { transform: scale(0.9, 1.12); }
      75% { transform: scale(1.05, 0.96); }
      100% { transform: scale(1); }
    }
    .animate-squish {
      animation: squishyPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 四方に弾けるパーティクル */
    @keyframes particleBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.25) rotate(var(--rot));
      }
    }
    .burst-particle {
      position: absolute;
      left: 50%;
      top: 50%;
      pointer-events: none;
      z-index: 30;
      animation: particleBurst 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* チョウチョ＆ミツバチのふわふわ飛行 */
    @keyframes flyAcross1 {
      0% { transform: translate(-10vw, 15vh) rotate(10deg); }
      25% { transform: translate(25vw, 8vh) rotate(-8deg); }
      50% { transform: translate(55vw, 18vh) rotate(12deg); }
      75% { transform: translate(85vw, 10vh) rotate(-5deg); }
      100% { transform: translate(110vw, 16vh) rotate(8deg); }
    }
    @keyframes flyAcross2 {
      0% { transform: translate(110vw, 65vh) scaleX(-1) rotate(8deg); }
      35% { transform: translate(70vw, 55vh) scaleX(-1) rotate(-10deg); }
      70% { transform: translate(30vw, 68vh) scaleX(-1) rotate(10deg); }
      100% { transform: translate(-10vw, 58vh) scaleX(-1) rotate(-6deg); }
    }
    .animate-butterfly {
      animation: flyAcross1 22s linear infinite;
    }
    .animate-bee {
      animation: flyAcross2 18s linear infinite;
    }

    /* ゆっくり回転する太陽 */
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-sun-spin {
      animation: slowSpin 24s linear infinite;
    }

    /* レベルアップ紙吹雪 */
    @keyframes confettiDrop {
      0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg) scale(0.8); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      top: -20px;
      z-index: 60;
      pointer-events: none;
      animation: confettiDrop linear forwards;
    }

    /* 雨粒アニメーション */
    .rain-overlay {
      background-image: radial-gradient(#4fc3f7 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      animation: rainFall 0.8s linear infinite;
    }
    @keyframes rainFall {
      0% { background-position: 0 0; }
      100% { background-position: -12px 24px; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.04); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 10px; }
  </style>
</head>
<body class="weather-sunny text-stone-800 antialiased flex flex-col relative">

  <!-- 雨エフェクト用レイヤー -->
  <div id="rain-layer" class="fixed inset-0 pointer-events-none z-10 opacity-0 transition-opacity duration-1000 rain-overlay"></div>

  <!-- 可愛い背景デコレーション＆生き物アニメーション -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div id="sky-sun" class="absolute top-16 right-6 text-5xl opacity-50 animate-sun-spin transition-opacity duration-700">☀️</div>
    <div id="sky-rainbow" class="absolute top-14 left-1/2 -translate-x-1/2 text-7xl opacity-0 transition-opacity duration-1000">🌈</div>
    <div class="absolute top-16 left-6 text-4xl opacity-45 animate-bounce" style="animation-duration: 4s;">☁️</div>
    <div class="absolute top-28 right-24 text-3xl opacity-40 animate-bounce" style="animation-duration: 5.5s;">☁️</div>
    <div class="absolute bottom-12 left-8 text-3xl opacity-50">🌷</div>
    <div class="absolute bottom-16 right-12 text-3xl opacity-50">🌼</div>
    <div class="absolute top-0 left-0 text-2xl opacity-75 animate-butterfly">🦋</div>
    <div class="absolute top-0 left-0 text-xl opacity-75 animate-bee">🐝</div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-30 border-b-2 border-pink-100">
    <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
      
      <!-- ロゴ＆タイトル -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 bg-gradient-to-br from-pink-400 via-rose-400 to-amber-300 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">
          🍓
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-black text-pink-600 tracking-tight leading-tight flex items-center gap-1">
            Happy Veggie World <span class="text-sm">🎀</span>
          </h1>
          <p class="text-[11px] text-emerald-600 font-bold" id="sync-status">Connecting...</p>
        </div>
      </div>

      <!-- コントロール群（天気・言語・サウンド・コイン・ログイン） -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 flex-wrap">
        
        <!-- 天気バッジ -->
        <div id="weather-badge" class="bg-sky-50 border border-sky-200 px-2.5 py-1 rounded-xl flex items-center gap-1.5 text-xs font-bold text-sky-900 shadow-sm" title="Global Weather">
          <span id="weather-icon" class="text-base">☀️</span>
          <span id="weather-label" class="hidden md:inline">Sunny</span>
        </div>

        <!-- 言語切り替えボタン -->
        <div class="bg-stone-100 p-0.5 rounded-xl border border-stone-200 flex items-center text-xs font-bold">
          <button onclick="window.setLanguage('ja')" id="lang-ja" class="px-2 py-1 rounded-lg transition">🇯🇵</button>
          <button onclick="window.setLanguage('en')" id="lang-en" class="px-2 py-1 rounded-lg transition">🇺🇸</button>
          <button onclick="window.setLanguage('es')" id="lang-es" class="px-2 py-1 rounded-lg transition">🇪🇸</button>
        </div>

        <!-- サウンド切り替え -->
        <button id="sound-toggle" onclick="window.toggleSound()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 p-2 rounded-xl border border-stone-200 text-xs transition" title="Toggle Sound">
          🔊
        </button>

        <!-- ファーマーレベル＆EXP表示 -->
        <div class="bg-emerald-100 border-2 border-emerald-300 px-2.5 py-1 rounded-2xl flex flex-col justify-center shadow-inner min-w-[76px]">
          <div class="flex items-center justify-between text-[11px] font-black text-emerald-900 leading-none">
            <span>🎓 Lv.<span id="level-display">1</span></span>
            <span id="exp-text" class="text-[9px] text-emerald-700">0/50</span>
          </div>
          <div class="w-full bg-emerald-200/80 h-1.5 rounded-full overflow-hidden mt-1">
            <div id="exp-bar" class="bg-emerald-600 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- コイン表示 -->
        <div class="bg-amber-100 border-2 border-amber-300 px-3 py-1 rounded-2xl flex items-center gap-1.5 shadow-inner">
          <span class="text-base sm:text-lg">🪙</span>
          <span id="coin-display" class="font-black text-amber-800 text-sm sm:text-base">100</span>
        </div>

        <!-- ユーザー情報 / ログインボタン -->
        <div id="auth-area" class="flex items-center"></div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-3 sm:px-5 py-5 grid grid-cols-1 lg:grid-cols-12 gap-5 relative z-20">

    <!-- 左側：農園エリア (7カラム) -->
    <section class="lg:col-span-7 flex flex-col gap-4">
      <div class="bg-white/95 backdrop-blur rounded-[2rem] p-4 sm:p-6 shadow-xl border-2 border-pink-100">
        
        <!-- 農園ヘッダー＆一括アクション -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
          <div>
            <h2 class="text-lg sm:text-xl font-black text-pink-700 flex items-center gap-2">
              <span id="farm-title-icon">🏡</span> <span id="farm-title-text" data-i18n="farmTitle">あなたの農園</span>
            </h2>
            <p id="weather-bonus-text" class="text-xs font-bold text-amber-600 mt-0.5"></p>
          </div>

          <div class="flex items-center gap-2" id="farm-header-actions">
            <button onclick="window.harvestAllReady()" class="bg-gradient-to-r from-amber-300 to-pink-300 hover:from-amber-400 hover:to-pink-400 active:scale-95 text-rose-950 font-black text-xs px-3.5 py-2 rounded-2xl shadow-sm transition flex items-center gap-1 border border-white">
              <span>🧺</span> <span data-i18n="harvestAll">一括収穫</span>
            </button>
          </div>
        </div>

        <!-- 訪問中バナー（他人の農園を見ているときのみ表示） -->
        <div id="visiting-banner" class="hidden mb-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-3 rounded-2xl shadow-md flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-2xl">🏡</span>
            <div class="min-w-0">
              <div class="text-xs font-black truncate" id="visiting-farmer-name">Visiting Farmer</div>
              <div class="text-[10px] text-indigo-100 font-bold" data-i18n="visitHelpHint">作物をタップしてお手伝い！（報酬あり）</div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="visit-friend-btn" onclick="window.toggleFriendFromVisit()" class="bg-white/20 hover:bg-white/30 text-white text-xs font-black px-2.5 py-1.5 rounded-xl transition">

        </div>

        <!-- 3x3 畑グリッド -->
        <div id="farm-grid" class="grid grid-cols-3 gap-3 sm:gap-4 aspect-square max-w-md mx-auto">
          <!-- JSで9つの区画を生成 -->
        </div>

        <!-- 農具・お世話ツールバー -->
        <div class="mt-4 bg-pink-50/80 rounded-2xl p-2.5 border-2 border-pink-100">
          <div class="text-[11px] font-black text-pink-800 mb-1.5 flex items-center justify-between">
            <span>🎀 <span id="toolbar-title-text" data-i18n="toolTitle">農具・肥料ツール（選択して畑をタップ）</span></span>
            <span id="selected-tool-desc" class="text-emerald-700 font-bold"></span>
          </div>
          <div id="tool-bar" class="grid grid-cols-4 sm:grid-cols-7 gap-1.5">
            <!-- JSでツールボタンを生成 -->
          </div>
        </div>

        <!-- 操作ガイド -->
        <div class="mt-3 bg-amber-50/80 rounded-2xl p-2.5 text-[11px] text-stone-600 flex flex-wrap justify-around gap-1.5 border border-amber-100 font-bold">
          <div class="flex items-center gap-1"><span>🚜</span> <span data-i18n="guidePlow">1.クワで耕す</span></div>
          <div class="flex items-center gap-1"><span>🌱</span> <span data-i18n="guidePlant">2.タネまき＆水やり</span></div>
          <div class="flex items-center gap-1"><span>🐛</span> <span data-i18n="guidePest">3.雑草・害虫ケアでSSランク！</span></div>
        </div>
      </div>
    </section>

    <!-- 右側：タネショップ＆世界ランキング＆実績 (5カラム) -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      
      <!-- タネショップ -->
      <div class="bg-white/95 backdrop-blur rounded-[2rem] p-4 sm:p-5 shadow-xl border-2 border-amber-100">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base sm:text-lg font-black text-amber-800 flex items-center gap-2">
            <span>🏪</span> <span data-i18n="shopTitle">タネショップ</span>
            <span class="text-[11px] bg-pink-100 text-pink-700 px-2.5 py-0.5 rounded-full font-black">34 Crops 🌸</span>
          </h2>
          <span class="text-xs font-bold text-stone-400" data-i18n="selectSeed">タネを選択</span>
        </div>

        <div id="seed-shop" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-1">
          <!-- JSで34種類のタネを生成 -->
        </div>
      </div>

      <!-- タブ切り替え（世界ランキング / フレンド / 収穫実績） -->
      <div class="bg-white/95 backdrop-blur rounded-[2rem] p-4 sm:p-5 shadow-xl border-2 border-emerald-100 flex-grow flex flex-col">
        <div class="flex items-center gap-1.5 mb-3 bg-stone-100 p-1 rounded-2xl">
          <button onclick="window.switchTab('ranking')" id="tab-ranking" class="flex-1 py-1.5 px-2 rounded-xl text-xs font-black transition bg-white text-emerald-800 shadow-sm">
            🏆 <span data-i18n="worldRanking">世界</span>
          </button>
          <button onclick="window.switchTab('friends')" id="tab-friends" class="flex-1 py-1.5 px-2 rounded-xl text-xs font-black transition text-stone-500 hover:text-stone-700">
            👥 <span data-i18n="friendsTab">フレンド</span>
          </button>
          <button onclick="window.switchTab('stats')" id="tab-stats" class="flex-1 py-1.5 px-2 rounded-xl text-xs font-black transition text-stone-500 hover:text-stone-700">
            📊 <span data-i18n="myHarvest">図鑑</span>
          </button>
        </div>

        <!-- 世界ランキングビュー -->
        <div id="view-ranking" class="space-y-2 max-h-64 overflow-y-auto pr-1 flex-grow">
          <p class="text-xs text-stone-400 text-center py-6">Loading World Farmers...</p>
        </div>

        <!-- フレンド＆お手伝い履歴ビュー -->
        <div id="view-friends" class="space-y-2 max-h-64 overflow-y-auto pr-1 flex-grow hidden">
          <!-- JSでフレンド一覧とお手伝いログを生成 -->
        </div>

        <!-- 収穫実績ビュー -->
        <div id="view-stats" class="space-y-2 max-h-64 overflow-y-auto pr-1 flex-grow hidden">
          <!-- JSで統計を生成 -->
        </div>
      </div>

    </section>
  </main>

  <!-- カスタムメッセージ通知トースト -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

      starfruit: { id: 'starfruit', reqLevel: 15, icon: '⭐', cropEmoji: '🌟', seedCost: 3500, sellPrice: 8800, exp: 2500, growTimeSec: 135, freshTimeSec: 22, waterDrainPerSec: 4.6, names: { ja: '虹のスターフルーツ', en: 'Rainbow Starfruit', es: 'Carambola Arcoíris' } },
      sakuraberry: { id: 'sakuraberry', reqLevel: 16, icon: '🌸', cropEmoji: '🍡', seedCost: 5000, sellPrice: 13000, exp: 3800, growTimeSec: 150, freshTimeSec: 20, waterDrainPerSec: 4.8, names: { ja: '夢見る桜もちベリー', en: 'Sakura Mochi Berry', es: 'Baya de Sakura' } }
    };

    // ==========================================
    // 4. サウンドエフェクト (標準 Web Audio API - 外部CDN不要)
    // ==========================================
    let soundEnabled = true;
    let audioCtx = null;

    function playTone(freq, startTime, duration = 0.12, type = 'triangle', gainVal = 0.12) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(gainVal, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        if (type === 'plant') {
          playTone(523.25, now, 0.1);
        } else if (type === 'water') {
          playTone(659.25, now, 0.1);
          playTone(783.99, now + 0.06, 0.12);
        } else if (type === 'fert') {
          playTone(880.00, now, 0.1);
          playTone(1318.51, now + 0.06, 0.14);
        } else if (type === 'wither') {
          playTone(130.81, now, 0.2, 'sawtooth', 0.08);
          playTone(123.47, now + 0.12, 0.25, 'sawtooth', 0.08);
        } else if (type === 'shovel') {
          playTone(196.00, now, 0.12, 'square', 0.06);
        } else if (type === 'harvest') {
          playTone(523.25, now, 0.1);
          playTone(659.25, now + 0.07, 0.1);
          playTone(783.99, now + 0.14, 0.1);
          playTone(1046.50, now + 0.21, 0.22);
        }
      } catch (e) {}
    }

    window.toggleSound = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
    };

    // ==========================================
    // 5. グローバル天気システム (全プレイヤー共通時間ベース)
    // ==========================================
    // 3分(180秒)周期で世界の天気が変化（全ユーザー同じ時間帯に同じ天気になる）
    function getCurrentWeather() {
      const cycleSec = Math.floor(Date.now() / 1000) % 180;
      if (cycleSec < 100) return 'sunny';     // 100秒間: 快晴
      if (cycleSec < 150) return 'rainy';     // 50秒間: 恵みの雨（成長2倍）
      return 'rainbow';                       // 30秒間: 虹（売値1.5倍）
    }

    let lastWeather = null;
    function updateWeatherUI() {
      const weather = getCurrentWeather();
      if (weather !== lastWeather) {
        lastWeather = weather;
        document.body.className = `weather-${weather} text-stone-800 antialiased flex flex-col relative`;
        const rainLayer = document.getElementById('rain-layer');
        rainLayer.style.opacity = weather === 'rainy' ? '0.45' : '0';
      }

      const iconEl = document.getElementById('weather-icon');
      const labelEl = document.getElementById('weather-label');
      const bonusEl = document.getElementById('weather-bonus-text');

      if (weather === 'sunny') {
        iconEl.textContent = '☀️';
        labelEl.textContent = 'Sunny';
        bonusEl.textContent = t('weatherSunny');
        bonusEl.className = 'text-xs font-bold text-emerald-600 mt-0.5';
      } else if (weather === 'rainy') {
        iconEl.textContent = '🌧️';
        labelEl.textContent = 'Rainy x2';
        bonusEl.textContent = t('weatherRainy');
        bonusEl.className = 'text-xs font-bold text-sky-600 mt-0.5 animate-pulse';
      } else {
        iconEl.textContent = '🌈';
        labelEl.textContent = 'Rainbow x1.5';
        bonusEl.textContent = t('weatherRainbow');
        bonusEl.className = 'text-xs font-bold text-pink-600 mt-0.5 animate-pulse';
      }
    }

    // ==========================================
    // 6. アプリケーション状態 & Firestore同期
    // ==========================================
    let currentUser = null;
    let unsubscribeUser = null;
    let unsubscribeLeaderboard = null;
    let unsubscribeVisiting = null;
    let selectedSeedId = 'radish';
    let selectedToolId = 'plow';
    let selectedCoopToolId = 'helpWater';
    let activeTab = 'ranking';
    let leaderboardData = [];

    // 訪問モード状態
    let visitingFarmer = null;     // { uid, name, level, lang, ... } または null
    let visitingFarmState = null;  // 訪問先の農園データ

    const emptyPlot = () => ({
      isPlowed: false,     // クワで耕されているか
      cropId: null,
      progressSec: 0,      // 累積成長秒数
      water: 60,           // 水分ゲージ (0〜100%, 0または100超で枯死)
      nutrients: 80,       // 土壌栄養度 (0〜100%)
      hasWeeds: false,     // 雑草発生フラグ
      hasPests: false,     // 害虫発生フラグ
      careScore: 100,      // 育成コンディション評価 (品質ランクに影響)
      speedFert: false,    // 成長肥料フラグ
      qualityFert: false,  // 品質肥料フラグ
      readySince: null,    // 100%到達時刻(ms)
      isWithered: false,   // 枯死フラグ
      witherReason: null   // 'dry' | 'rot' | 'overwater'
    });

    const createInitialGameState = () => ({
      coins: 120,
      exp: 0,
      totalHarvested: 0,
      plots: Array.from({ length: 9 }, () => emptyPlot()),
      harvestCounts: {},
      friends: [],         // フレンドのUID配列
      helperLogs: [],      // 誰がお手伝いしてくれたかのログ
      lastTickAt: Date.now(),
      updatedAt: Date.now()
    });

    let gameState = createInitialGameState();

    // 経験値から現在のファーマーレベルを計算 (Lv.1スタート)
    function getFarmerLevelInfo(exp = 0) {
      let level = 1;
      let required = 50;
      let remainingExp = exp;

      while (remainingExp >= required) {
        remainingExp -= required;
        level++;
        required = Math.floor(required * 1.45);
      }

      return {
        level,
        currentExp: remainingExp,
        nextLevelExp: required,
        percent: Math.min(100, Math.floor((remainingExp / required) * 100))
      };
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-stone-800 text-white border-stone-600',
        success: 'bg-emerald-600 text-white border-emerald-400',
        warning: 'bg-amber-500 text-white border-amber-300',
        error: 'bg-rose-600 text-white border-rose-400'
      };

      toast.className = `${colors[type]} border px-4 py-2 rounded-2xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function showFloatingEffect(plotIndex, text, colorClass = 'text-amber-300') {
      const plotEl = document.querySelector(`[data-plot-index="${plotIndex}"]`);
      if (!plotEl) return;
      const floater = document.createElement('div');
      floater.className = `floating-text absolute inset-0 flex items-center justify-center font-black text-base sm:text-lg drop-shadow-md z-20 ${colorClass}`;
      floater.textContent = text;
      plotEl.appendChild(floater);
      setTimeout(() => floater.remove(), 1100);
    }

    // 畑タップ時のパーティクル爆発＆ぷるんっ！バウンス演出
    function triggerPlotParticles(plotIndex, emojis = ['✨', '🌸']) {
      const plotEl = document.querySelector(`[data-plot-index="${plotIndex}"]`);
      if (!plotEl) return;

      plotEl.classList.remove('animate-squish');
      void plotEl.offsetWidth; // リフローで再トリガー
      plotEl.classList.add('animate-squish');

      const count = 7;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('span');
        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
        const dist = 36 + Math.random() * 28;
        const tx = Math.round(Math.cos(angle) * dist) + 'px';
        const ty = Math.round(Math.sin(angle) * dist - 12) + 'px';
        const rot = Math.round(Math.random() * 360 - 180) + 'deg';

        p.className = 'burst-particle text-sm sm:text-base';
        p.style.setProperty('--tx', tx);
        p.style.setProperty('--ty', ty);
        p.style.setProperty('--rot', rot);
        p.textContent = emojis[i % emojis.length];
        plotEl.appendChild(p);
        setTimeout(() => p.remove(), 860);
      }
    }

    // レベルアップ時のお祝い紙吹雪シャワー
    function triggerLevelUpConfetti() {
      const icons = ['🎉', '🌸', '⭐', '🍓', '✨', '🎀', '🪙'];
      for (let i = 0; i < 28; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece text-xl sm:text-2xl';
        piece.textContent = icons[i % icons.length];
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
        piece.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    // 世界ランキングのリアルタイム購読（ルール2準拠：orderByを使わずメモリでソート）
    function getUserDocRef(uid) {
      return doc(db, 'artifacts', appId, 'users', uid, 'gameData', 'state');
    }

    function getPublicLeaderboardDocRef(uid) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'worldFarmers', uid);
    }

    async function saveGameState() {
      gameState.updatedAt = Date.now();
      renderAll();
      if (!currentUser) return;

      try {
        await setDoc(getUserDocRef(currentUser.uid), gameState, { merge: true });
        if (!currentUser.isAnonymous) {
          const totalHarvest = Object.values(gameState.harvestCounts || {}).reduce((a, b) => a + b, 0);
          const lvlInfo = getFarmerLevelInfo(gameState.exp || 0);
          await setDoc(getPublicLeaderboardDocRef(currentUser.uid), {
            uid: currentUser.uid,
            name: currentUser.displayName || 'Farmer',
            lang: currentLang,
            level: lvlInfo.level,
            coins: gameState.coins || 0,
            totalHarvest,
            plots: gameState.plots,
            updatedAt: Date.now()
          }, { merge: true });
        }
        document.getElementById('sync-status').textContent = t('cloudSaved');
      } catch (e) {
        // ネットワーク一時停止や権限制限時もローカルプレイは継続
      }
    }

    function startListeningLeaderboard() {
      if (unsubscribeLeaderboard) unsubscribeLeaderboard();
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'worldFarmers');

      unsubscribeLeaderboard = onSnapshot(colRef, (snapshot) => {
        const list = [];
        snapshot.forEach((docSnap) => {
          list.push(docSnap.data());
        });
        // 総収穫数 ＋ コイン価値で総合スコア計算して降順ソート
        list.sort((a, b) => {
          const scoreA = (a.totalHarvest || 0) * 100 + (a.coins || 0);
          const scoreB = (b.totalHarvest || 0) * 100 + (b.coins || 0);
          return scoreB - scoreA;
        });
        leaderboardData = list.slice(0, 10);
        renderLeaderboard();
      }, () => {
        // Firestoreルールで未許可の場合でもエラーを握りつぶし、自分のローカル順位を表示
        if (currentUser && !currentUser.isAnonymous) {
          const totalHarvest = Object.values(gameState.harvestCounts || {}).reduce((a, b) => a + b, 0);
          const lvlInfo = getFarmerLevelInfo(gameState.exp || 0);
          leaderboardData = [{
            uid: currentUser.uid,
            name: currentUser.displayName || 'Farmer',
            lang: currentLang,
            level: lvlInfo.level,
            coins: gameState.coins || 0,
            totalHarvest
          }];
        }
        renderLeaderboard();
      });
    }

    function startListeningUserData(uid) {
      if (unsubscribeUser) unsubscribeUser();
      const docRef = getUserDocRef(uid);
      document.getElementById('sync-status').textContent = t('syncing');

      unsubscribeUser = onSnapshot(docRef, async (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          gameState = { ...createInitialGameState(), ...data };
          if (!Array.isArray(gameState.plots) || gameState.plots.length !== 9) {
            gameState.plots = createInitialGameState().plots;
          } else {
            gameState.plots = gameState.plots.map(p => ({ ...emptyPlot(), ...p }));
          }
          if (!Array.isArray(gameState.friends)) gameState.friends = [];
          if (!Array.isArray(gameState.helperLogs)) gameState.helperLogs = [];
          gameState.lastTickAt = Date.now();
        } else {
          gameState = createInitialGameState();
          await setDoc(docRef, gameState);
        }
        document.getElementById('sync-status').textContent = t('cloudSaved');
        renderAll();
      }, (error) => {
        console.error("User data error:", error);
      });
    }

    // ==========================================
    // 7. 農園訪問・フレンド・お手伝い機能
    // ==========================================
    window.visitFarmer = (targetUid) => {
      if (!targetUid) return;
      if (currentUser && targetUid === currentUser.uid) {
        window.returnHome();
        return;
      }

      const targetInfo = leaderboardData.find(u => u.uid === targetUid) || { uid: targetUid, name: 'Farmer' };
      visitingFarmer = targetInfo;
      visitingFarmState = {
        plots: Array.isArray(targetInfo.plots) && targetInfo.plots.length === 9
          ? targetInfo.plots.map(p => ({ ...emptyPlot(), ...p }))
          : Array.from({ length: 9 }, () => emptyPlot())
      };

      if (unsubscribeVisiting) unsubscribeVisiting();
      const targetDocRef = getPublicLeaderboardDocRef(targetUid);
      unsubscribeVisiting = onSnapshot(targetDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          visitingFarmer = data;
          visitingFarmState = {
            plots: Array.isArray(data.plots) && data.plots.length === 9
              ? data.plots.map(p => ({ ...emptyPlot(), ...p }))
              : Array.from({ length: 9 }, () => emptyPlot())
          };
          renderAll();
        }
      }, () => {});

      selectedCoopToolId = 'helpWater';
      showToast(`🏡 ${targetInfo.name}${t('visitingTitleSuffix')}`, 'info');
      renderAll();
    };

    window.returnHome = () => {
      if (unsubscribeVisiting) {
        unsubscribeVisiting();
        unsubscribeVisiting = null;
      }
      visitingFarmer = null;
      visitingFarmState = null;
      renderAll();
    };

    window.toggleFriend = async (targetUid) => {
      if (!targetUid || (currentUser && targetUid === currentUser.uid)) return;
      if (!Array.isArray(gameState.friends)) gameState.friends = [];

      const idx = gameState.friends.indexOf(targetUid);
      if (idx >= 0) {
        gameState.friends.splice(idx, 1);
        showToast(t('friendRemoved'), 'info');
      } else {
        gameState.friends.push(targetUid);
        playSound('fert');
        showToast(t('friendAdded'), 'success');
      }
      await saveGameState();
    };

    window.toggleFriendFromVisit = () => {
      if (visitingFarmer) {
        window.toggleFriend(visitingFarmer.uid);
      }

    window.selectCoopTool = (toolId) => {
      selectedCoopToolId = toolId;

    async function handleVisitPlotClick(index) {
      if (!visitingFarmer || !visitingFarmState) return;
      const plot = visitingFarmState.plots[index];

      if (!plot || !plot.cropId) {
        showToast(t('emptyPlotVisitMsg'), 'info');
        return;
      }

      const crop = CROPS[plot.cropId];
      const progress = getPlotProgress(plot);
      const myName = (currentUser && !currentUser.isAnonymous && currentUser.displayName) ? currentUser.displayName : 'Guest Helper';

      // 1. 復活の秘薬（枯死状態の作物のみ）
      if (selectedCoopToolId === 'helpRevive') {
        if (!plot.isWithered) {
          showToast(t('notWitheredMsg'), 'warning');
          return;
        }
        if (gameState.coins < 25) {
          showToast(`${t('notEnoughCoins')} (25🪙)`, 'warning');
          return;
        }
        playSound('harvest');
        gameState.coins -= 25;
        gameState.exp = (gameState.exp || 0) + 50;

        plot.isWithered = false;
        plot.witherReason = null;
        plot.water = 75;
        plot.readySince = Date.now();

        showFloatingEffect(index, '💖REVIVED! +50EXP', 'text-pink-300');
        triggerPlotParticles(index, ['💖', '🌸', '✨']);
        showToast(t('helpedReviveMsg'), 'success');
        await pushCoopUpdateToNeighbor(plot, index, `💖 ${myName} revived ${crop.names.en}!`);
        await saveGameState();
        return;
      }

      if (plot.isWithered) {
        showToast(t('needShovel'), 'warning');
        return;
      }

      if (progress >= 1) {
        showToast(t('ripePlotVisitMsg'), 'info');
        return;
      }

      // 2. お手伝い水やり（無料・報酬コイン＋EXP）
      if (selectedCoopToolId === 'helpWater') {
        playSound('water');
        plot.water = Math.min(95, (plot.water ?? 60) + 45);
        gameState.coins += 15;
        gameState.exp = (gameState.exp || 0) + 10;

        showFloatingEffect(index, '💧+45% (+15🪙)', 'text-sky-300');
        triggerPlotParticles(index, ['💧', '🫧', '✨']);
        showToast(t('helpedWaterMsg'), 'success');
        await pushCoopUpdateToNeighbor(plot, index, `💧 ${myName} watered ${crop.names.en}!`);
        await saveGameState();
        return;
      }

      // 3. 応援肥料（10コイン消費・EXP獲得）
      if (selectedCoopToolId === 'helpFert') {
        if (plot.speedFert) {
          showToast(t('alreadyFert'), 'info');
          return;
        }
        if (gameState.coins < 10) {
          showToast(`${t('notEnoughCoins')} (10🪙)`, 'warning');
          return;
        }
        playSound('fert');
        gameState.coins -= 10;
        gameState.exp = (gameState.exp || 0) + 25;
        plot.speedFert = true;

        showFloatingEffect(index, '✨BOOST! +25EXP', 'text-yellow-300');
        triggerPlotParticles(index, ['✨', '⚡', '🌟']);
        showToast(t('helpedFertMsg'), 'success');
        await pushCoopUpdateToNeighbor(plot, index, `✨ ${myName} boosted ${crop.names.en}!`);
        await saveGameState();
        return;
      }
    }

    async function pushCoopUpdateToNeighbor(updatedPlot, index, logMessage) {
      if (!visitingFarmer || !visitingFarmState) return;
      try {
        const updatedPlots = [...visitingFarmState.plots];
        updatedPlots[index] = updatedPlot;
        const existingLogs = Array.isArray(visitingFarmer.helperLogs) ? visitingFarmer.helperLogs : [];
        const newLogs = [{ text: logMessage, at: Date.now() }, ...existingLogs].slice(0, 15);

        await updateDoc(getPublicLeaderboardDocRef(visitingFarmer.uid), {
          plots: updatedPlots,
          helperLogs: newLogs
        });
      } catch (e) {
        // 相手のドキュメント更新がルール上制限されている場合でもローカル報酬は維持
      }
    }

    // ==========================================
    // 8. ゲームプレイ・ロジック（本格シミュレーション）
    // ==========================================
    function getPlotProgress(plot) {
      if (!plot.cropId) return 0;
      const crop = CROPS[plot.cropId];
      if (!crop) return 0;
      return Math.min(1, Math.max(0, (plot.progressSec || 0) / crop.growTimeSec));
    }

    // 育成コンディションから品質ランク（B / A / S / SS）と倍率を算出
    function getCropGradeInfo(plot) {
      if (!plot) return { grade: 'A', mult: 1.0, badgeColor: 'bg-emerald-500 text-white' };
      const score = (plot.careScore ?? 100) + (plot.qualityFert ? 25 : 0) + ((plot.nutrients ?? 80) >= 70 ? 10 : 0);
      if (score >= 120) return { grade: '👑SS', mult: 1.8, badgeColor: 'bg-gradient-to-r from-amber-400 to-pink-500 text-white' };
      if (score >= 95) return { grade: '⭐S', mult: 1.35, badgeColor: 'bg-amber-400 text-amber-950' };
      if (score >= 70) return { grade: 'A', mult: 1.0, badgeColor: 'bg-emerald-500 text-white' };
      return { grade: 'B', mult: 0.75, badgeColor: 'bg-stone-400 text-white' };
    }

    function getSellPriceWithBonuses(crop, plot) {
      let price = crop.sellPrice;
      if (plot) {
        const gradeInfo = getCropGradeInfo(plot);
        price *= gradeInfo.mult;
      }
      if (getCurrentWeather() === 'rainbow') price *= 1.5;
      return Math.round(price);
    }

    // 毎秒のリアルタイムシミュレーション（成長・水分減少・雑草・害虫・枯死判定）
    function simulateTick() {
      const now = Date.now();
      const dtSec = Math.min(5, Math.max(0.1, (now - (gameState.lastTickAt || now)) / 1000));
      gameState.lastTickAt = now;

      const weather = getCurrentWeather();
      let stateChanged = false;
      let someoneWithered = false;

      gameState.plots.forEach((plot, idx) => {
        if (!plot.cropId || plot.isWithered) return;
        const crop = CROPS[plot.cropId];
        if (!crop) return;

        const progress = getPlotProgress(plot);

        // 1. まだ成長途中の場合
        if (progress < 1) {
          // ランダムで雑草・害虫が発生（リアル農業の手間）
          if (!plot.hasWeeds && Math.random() < 0.025 * dtSec) {
            plot.hasWeeds = true;
            stateChanged = true;
          }
          if (!plot.hasPests && weather !== 'rainy' && Math.random() < 0.018 * dtSec) {
            plot.hasPests = true;
            stateChanged = true;
          }

          // 雑草・害虫放置による栄養低下＆品質スコア減少
          if (plot.hasWeeds) {
            plot.nutrients = Math.max(0, (plot.nutrients ?? 80) - 2.5 * dtSec);
            plot.careScore = Math.max(30, (plot.careScore ?? 100) - 1.5 * dtSec);
          }
          if (plot.hasPests) {
            plot.careScore = Math.max(30, (plot.careScore ?? 100) - 2.5 * dtSec);
          }

          // 天気による水分変化（雨なら自動回復、快晴なら乾燥加速）
          if (weather === 'rainy') {
            plot.water = Math.min(95, (plot.water ?? 60) + 4 * dtSec);
          } else {
            const sunnyFactor = weather === 'sunny' ? 1.25 : 1.0;
            plot.water = Math.max(0, (plot.water ?? 60) - crop.waterDrainPerSec * sunnyFactor * dtSec);
          }

          // 水分0%で枯死！
          if (plot.water <= 0) {
            plot.water = 0;
            plot.isWithered = true;
            plot.witherReason = 'dry';
            someoneWithered = true;
            stateChanged = true;
            showFloatingEffect(idx, '🥀DRY!', 'text-rose-400');
            return;
          }

          // 水分・栄養・害虫による成長効率計算
          let waterEfficiency = 1.0;
          if (plot.water < 20) waterEfficiency = 0.4;
          else if (plot.water > 85) waterEfficiency = 0.7;

          const nutrientEfficiency = (plot.nutrients ?? 80) >= 40 ? 1.0 : 0.65;
          const pestPenalty = plot.hasPests ? 0.35 : 1.0;
          const weedPenalty = plot.hasWeeds ? 0.75 : 1.0;
          const weatherSpeed = weather === 'rainy' ? 2.0 : 1.0;
          const fertSpeed = plot.speedFert ? 1.6 : 1.0;

          plot.progressSec = (plot.progressSec || 0) + dtSec * waterEfficiency * nutrientEfficiency * pestPenalty * weedPenalty * weatherSpeed * fertSpeed;
          stateChanged = true;

          // 100%到達チェック
          if (plot.progressSec >= crop.growTimeSec) {
            plot.progressSec = crop.growTimeSec;
            plot.readySince = now;
          }
        } else {
          // 2. 収穫可能状態（100%）の鮮度カウントダウン
          if (!plot.readySince) plot.readySince = now;
          const elapsedReadySec = (now - plot.readySince) / 1000;
          if (elapsedReadySec >= crop.freshTimeSec) {
            plot.isWithered = true;
            plot.witherReason = 'rot';
            someoneWithered = true;
            stateChanged = true;
            showFloatingEffect(idx, '🥀ROT!', 'text-rose-400');
          }
        }
      });

      if (someoneWithered) {
        playSound('wither');
        showToast(t('witheredDry'), 'error');
        saveGameState();
      } else if (stateChanged) {
        renderFarm();
      }
    }

    async function handlePlotClick(index) {
      // 訪問モード中はお手伝いクリック処理へ分岐
      if (visitingFarmer) {
        await handleVisitPlotClick(index);
        return;
      }

      const plot = gameState.plots[index];

      // 【ツール：スコップ】いつでも撤去可能
      if (selectedToolId === 'shovel') {
        if (!plot.cropId) return;
        playSound('shovel');
        gameState.plots[index] = emptyPlot();
        showFloatingEffect(index, '⛏️', 'text-stone-300');
        showToast(t('cleanedPlot'), 'info');
        await saveGameState();
        return;
      }

      // 枯れている場合はスコップを促す
      if (plot.cropId && plot.isWithered) {
        playSound('wither');
        showToast(t('needShovel'), 'warning');
        return;
      }

      // 【空き地の場合】：まずクワで耕す → その後タネまき
      if (!plot.cropId) {
        if (!plot.isPlowed) {
          if (selectedToolId !== 'plow') {
            window.selectTool('plow');
            showToast(t('needPlowMsg'), 'warning');
            return;
          }
          playSound('shovel');
          plot.isPlowed = true;
          plot.nutrients = 85;
          showFloatingEffect(index, '🚜TILLED!', 'text-amber-200');
          triggerPlotParticles(index, ['🟫', '✨', '🌱']);
          showToast(t('plowedMsg'), 'success');
          await saveGameState();
          return;
        }

        // 耕し済みならタネまき
        if (selectedToolId !== 'hand') {
          window.selectTool('hand');
        }
        const crop = CROPS[selectedSeedId];
        const lvlInfo = getFarmerLevelInfo(gameState.exp || 0);
        if (lvlInfo.level < crop.reqLevel) {
          showToast(`🔒 Lv.${crop.reqLevel} ${t('levelLocked')}`, 'warning');
          return;
        }
        if (gameState.coins < crop.seedCost) {
          showToast(`${t('notEnoughCoins')} (${crop.seedCost}🪙)`, 'warning');
          return;
        }

        playSound('plant');
        gameState.coins -= crop.seedCost;
        gameState.plots[index] = {
          ...emptyPlot(),
          isPlowed: true,
          cropId: crop.id,
          water: 60,
          nutrients: plot.nutrients ?? 85,
          careScore: 100
        };

        showFloatingEffect(index, `-${crop.seedCost}🪙`, 'text-rose-300');
        triggerPlotParticles(index, ['🌱', '🌸', '✨']);
        await saveGameState();
        return;
      }

      // 以降、作物が植わっている状態
      const crop = CROPS[plot.cropId];
      const progress = getPlotProgress(plot);

      // 【完成している場合】：どのツールでも（スコップ以外）タップで即収穫！
      if (progress >= 1) {
        playSound('harvest');
        const prevLevel = getFarmerLevelInfo(gameState.exp || 0).level;
        const gradeInfo = getCropGradeInfo(plot);
        const earned = getSellPriceWithBonuses(crop, plot);
        const gainedExp = crop.exp || 10;

        gameState.coins += earned;
        gameState.exp = (gameState.exp || 0) + gainedExp;
        gameState.harvestCounts[crop.id] = (gameState.harvestCounts[crop.id] || 0) + 1;
        // 収穫後は土が硬くなるので再耕作が必要に
        gameState.plots[index] = emptyPlot();

        const newLevel = getFarmerLevelInfo(gameState.exp).level;
        showFloatingEffect(index, `${gradeInfo.grade} +${earned}🪙`, 'text-amber-300');
        triggerPlotParticles(index, [crop.cropEmoji, '🪙', '⭐', '🎉']);
        showToast(`[${gradeInfo.grade}] ${crop.names[currentLang]}${t('harvestedMsg')} +${earned}🪙 (+${gainedExp}EXP)`, 'success');

        if (newLevel > prevLevel) {
          triggerLevelUpConfetti();
          setTimeout(() => showToast(`Lv.${newLevel} ${t('levelUpMsg')}`, 'success'), 500);
        }

        await saveGameState();
        return;
      }

      // 【害虫駆除ツール】
      if (selectedToolId === 'pest') {
        if (!plot.hasPests) {
          showToast('✨ 🐛はいません！', 'info');
          return;
        }
        if (gameState.coins < 10) {
          showToast(`${t('notEnoughCoins')} (10🪙)`, 'warning');
          return;
        }
        playSound('fert');
        gameState.coins -= 10;
        plot.hasPests = false;
        plot.careScore = Math.min(125, (plot.careScore ?? 100) + 10);
        showFloatingEffect(index, '🧴CURED!', 'text-emerald-300');
        triggerPlotParticles(index, ['🫧', '✨', '💚']);
        showToast(t('pestCuredMsg'), 'success');
        await saveGameState();
        return;
      }

      // 【育成中の場合】：雑草が生えていれば手ツールで抜ける
      if (plot.hasWeeds && (selectedToolId === 'hand' || selectedToolId === 'plow')) {
        playSound('plant');
        plot.hasWeeds = false;
        plot.careScore = Math.min(125, (plot.careScore ?? 100) + 8);
        showFloatingEffect(index, '🌿WEEDED!', 'text-lime-300');
        triggerPlotParticles(index, ['🌿', '✨']);
        showToast(t('weedRemovedMsg'), 'success');
        await saveGameState();
        return;
      }

      if (selectedToolId === 'water' || selectedToolId === 'hand') {
        playSound('water');
        plot.water = (plot.water ?? 60) + 45;

        // 100%を超えると根腐れで枯死！
        if (plot.water > 100) {
          plot.water = 100;
          plot.isWithered = true;
          plot.witherReason = 'overwater';
          playSound('wither');
          showFloatingEffect(index, '💦🥀ROOT ROT!', 'text-rose-400');
          showToast(t('witheredOverwater'), 'error');
        } else if (plot.water > 85) {
          showFloatingEffect(index, '💧+45% ⚠️', 'text-amber-300');
          showToast(t('overWatered'), 'warning');
        } else {
          showFloatingEffect(index, t('waterBoost'), 'text-sky-300');
          triggerPlotParticles(index, ['💧', '🫧', '💙']);
        }
        await saveGameState();
        return;
      }

      if (selectedToolId === 'speedFert') {
        if (plot.speedFert) {
          showToast(t('alreadyFert'), 'info');
          return;
        }
        if (gameState.coins < 15) {
          showToast(`${t('notEnoughCoins')} (15🪙)`, 'warning');
          return;
        }
        playSound('fert');
        gameState.coins -= 15;
        plot.speedFert = true;
        plot.nutrients = Math.min(100, (plot.nutrients ?? 80) + 25);
        showFloatingEffect(index, '⚡SPEED & NPK!', 'text-yellow-300');
        triggerPlotParticles(index, ['⚡', '✨', '🌟']);
        showToast(t('fertApplied'), 'success');
        await saveGameState();
        return;
      }

      if (selectedToolId === 'qualityFert') {
        if (plot.qualityFert) {
          showToast(t('alreadyFert'), 'info');
          return;
        }
        if (gameState.coins < 30) {
          showToast(`${t('notEnoughCoins')} (30🪙)`, 'warning');
          return;
        }
        playSound('fert');
        gameState.coins -= 30;
        plot.qualityFert = true;
        plot.nutrients = Math.min(100, (plot.nutrients ?? 80) + 30);
        showFloatingEffect(index, '💎SS GRADE UP!', 'text-purple-300');
        triggerPlotParticles(index, ['💎', '💖', '✨']);
        showToast(t('fertApplied'), 'success');
        await saveGameState();
        return;
      }
    }

    // 一括収穫機能

      gameState.plots.forEach((plot, idx) => {

          showFloatingEffect(idx, `+${earned}🪙`, 'text-amber-300');
          triggerPlotParticles(idx, [crop.cropEmoji, '🪙', '✨']);
        }
      });

      if (count > 0) {
        playSound('harvest');
        gameState.coins += totalEarned;
        gameState.exp = (gameState.exp || 0) + totalExp;

          if (unsubscribeUser) unsubscribeUser();
          if (unsubscribeLeaderboard) unsubscribeLeaderboard();
          gameState = createInitialGameState();
          renderAll();
        }
      });

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        try {
          await signInWithCustomToken(auth, __initial_auth_token);
        } catch (e) {
          await signInAnonymously(auth).catch(() => {});
        }
      } else if (!auth.currentUser) {
        // ゲスト時も匿名認証を行い、request.auth != null のルールを通過できるようにする
        await signInAnonymously(auth).catch(() => {});
      }
    }

    function renderShop() {
      const shopEl = document.getElementById('seed-shop');
      const lvlInfo = getFarmerLevelInfo(gameState.exp || 0);

      shopEl.innerHTML = Object.values(CROPS).map(crop => {
        const isLocked = lvlInfo.level < crop.reqLevel;
        const isSelected = !isLocked && selectedSeedId === crop.id && selectedToolId === 'hand';
        const sellPrice = getSellPriceWithBonuses(crop, null);

        if (isLocked) {
          return `
            <button 
              onclick="window.selectSeed('${crop.id}')"
              class="text-left p-2.5 rounded-2xl border-2 border-stone-200 bg-stone-100/80 opacity-70 flex flex-col justify-between cursor-not-allowed"
            >
              <div class="flex items-center justify-between w-full mb-1">
                <span class="text-xl sm:text-2xl grayscale">🔒</span>
                <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-stone-300 text-stone-700">
                  Lv.${crop.reqLevel}
                </span>
              </div>
              <div class="font-bold text-xs text-stone-500 truncate w-full">${crop.names[currentLang]}</div>
              <div class="text-[10px] text-stone-400 mt-0.5">
                Unlock at Lv.${crop.reqLevel}
              </div>
            </button>
          `;
        }

        return `
          <button 
            onclick="window.selectSeed('${crop.id}')"
            class="text-left p-2.5 rounded-2xl border-2 transition-all flex flex-col justify-between ${
              isSelected 
                ? 'bg-amber-50 border-amber-400 shadow-md scale-[1.02]' 
                : 'bg-white hover:bg-stone-50 border-stone-200'
            }"
          >
            <div class="flex items-center justify-between w-full mb-1">
              <div class="flex items-center gap-1">
                <span class="text-xl sm:text-2xl">${crop.icon}</span>
                <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">Lv.${crop.reqLevel}</span>
              </div>
              <span class="text-[11px] font-black px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">
                ${crop.seedCost}🪙
              </span>
            </div>
            <div class="font-bold text-xs sm:text-sm text-stone-800 truncate w-full">${crop.names[currentLang]}</div>
            <div class="text-[10px] text-stone-500 mt-0.5 flex justify-between w-full">
              <span>⏱️${crop.growTimeSec}s ✨+${crop.exp}</span>
              <span class="text-emerald-600 font-bold">${sellPrice}🪙</span>
            </div>
          </button>
        `;
      }).join('');
    }

    function renderStats() {
      const statsEl = document.getElementById('view-stats');
      statsEl.innerHTML = Object.values(CROPS).map(crop => {
        const count = gameState.harvestCounts?.[crop.id] || 0;
        return `
          <div class="flex items-center justify-between bg-stone-50 px-3 py-2 rounded-xl border border-stone-100">
            <div class="flex items-center gap-2.5">
              <span class="text-xl">${crop.icon}</span>
              <div class="text-xs font-bold text-stone-800">${crop.names[currentLang]}</div>
            </div>
            <div class="font-black text-xs text-emerald-700 bg-emerald-100/80 px-2.5 py-1 rounded-lg">
              ${count}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderFarm() {
      const gridEl = document.getElementById('farm-grid');
      const titleIconEl = document.getElementById('farm-title-icon');
      const titleTextEl = document.getElementById('farm-title-text');
      const headerActionsEl = document.getElementById('farm-header-actions');
      const visitingBannerEl = document.getElementById('visiting-banner');

      const isVisiting = Boolean(visitingFarmer && visitingFarmState);
      const activePlots = isVisiting ? visitingFarmState.plots : gameState.plots;

      if (isVisiting) {
        titleIconEl.textContent = '🏡';
        titleTextEl.textContent = `${visitingFarmer.name || 'Farmer'}${t('visitingTitleSuffix')}`;
        headerActionsEl.classList.add('hidden');
        visitingBannerEl.classList.remove('hidden');
        document.getElementById('visiting-farmer-name').textContent = `🏡 ${visitingFarmer.name || 'Farmer'} (Lv.${visitingFarmer.level || 1})`;

        const isFriend = (gameState.friends || []).includes(visitingFarmer.uid);
        const friendBtn = document.getElementById('visit-friend-btn');
        friendBtn.textContent = isFriend ? '⭐ Friend ✓' : '☆ +Friend';
        friendBtn.className = isFriend
          ? 'bg-amber-400 text-amber-950 text-xs font-black px-2.5 py-1.5 rounded-xl shadow transition'
          : 'bg-white/20 hover:bg-white/30 text-white text-xs font-black px-2.5 py-1.5 rounded-xl transition';
      } else {
        titleIconEl.textContent = '🚜';
        titleTextEl.textContent = t('farmTitle');
        headerActionsEl.classList.remove('hidden');
        visitingBannerEl.classList.add('hidden');
      }

      gridEl.innerHTML = '';

      activePlots.forEach((plot, index) => {
        const cell = document.createElement('button');
        cell.setAttribute('data-plot-index', index);
        cell.onclick = () => handlePlotClick(index);

        let soilClass = '';
        if (!plot.cropId) {
          soilClass = plot.isPlowed ? 'watered' : 'unplowed';
        } else {
          if (plot.isWithered) soilClass = 'withered';
          else if ((plot.water ?? 60) >= 35) soilClass = 'watered';
          else soilClass = 'dry';
        }

        cell.className = `farm-plot ${soilClass} rounded-2xl sm:rounded-3xl relative flex flex-col items-center justify-center p-2 cursor-pointer overflow-hidden`;

        if (!plot.cropId) {
          if (isVisiting) {
            cell.innerHTML = `<span class="text-stone-300/30 text-xl font-bold">🌱</span>`;
          } else if (!plot.isPlowed) {
            cell.innerHTML = `
              <span class="text-amber-200/70 text-2xl sm:text-3xl font-bold">🚜</span>
              <span class="text-[10px] text-amber-100/90 font-bold mt-1 text-center leading-tight">
                ${t('plowHint')}
              </span>
            `;
          } else {
            const selectedCrop = CROPS[selectedSeedId];
            cell.innerHTML = `
              <span class="text-emerald-200/70 text-2xl sm:text-3xl font-bold">+</span>
              <span class="text-[10px] text-emerald-100/90 font-bold mt-1 text-center leading-tight">
                ${selectedCrop.names[currentLang]}${t('plantHint')}
              </span>
            `;
          }
        } else if (plot.isWithered) {
          // 枯死状態の表示
          cell.innerHTML = `
            <span class="absolute top-1.5 right-1.5 bg-rose-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow">${t('witheredBadge')}</span>
            <div class="text-3xl sm:text-5xl grayscale opacity-80 my-1">🥀</div>
            <span class="text-[10px] text-rose-200 font-bold mt-1 bg-black/50 px-2 py-0.5 rounded-full">
              ${isVisiting ? '💖 Revive!' : t('tapShovel')}
            </span>
          `;
        } else {
          const crop = CROPS[plot.cropId];
          const progress = getPlotProgress(plot);
          const percent = Math.floor(progress * 100);
          const waterPct = Math.round(plot.water ?? 60);

          let stageEmoji = '🌱';
          let animClass = 'animate-crop';
          let statusBadge = '';

          if (progress >= 1) {
            stageEmoji = crop.cropEmoji;
            animClass = 'animate-ready';
            const elapsedReady = (Date.now() - (plot.readySince || Date.now())) / 1000;
            const remainFresh = Math.max(0, Math.ceil(crop.freshTimeSec - elapsedReady));
            const urgentClass = remainFresh <= 10 ? 'bg-rose-500 text-white animate-ping' : 'bg-amber-400 text-amber-950';
            statusBadge = `<span class="absolute top-1.5 right-1.5 ${urgentClass} text-[9px] font-black px-1.5 py-0.5 rounded-full shadow">⏰${remainFresh}s</span>`;
          } else if (progress >= 0.5) {
            stageEmoji = '🌿';
          }

          const fertBadges = `${plot.speedFert ? '⚡' : ''}${plot.qualityFert ? '💎' : ''}`;
          const pestWeedBadges = `${plot.hasWeeds ? '<span class="animate-bounce inline-block">🌿</span>' : ''}${plot.hasPests ? '<span class="animate-ping inline-block">🐛</span>' : ''}`;
          const gradeInfo = getCropGradeInfo(plot);

          let waterColor = 'bg-sky-400';
          if (waterPct <= 20) waterColor = 'bg-rose-500 animate-pulse';
          else if (waterPct > 85) waterColor = 'bg-amber-400';

          cell.innerHTML = `
            ${statusBadge}
            <div class="text-[10px] absolute top-1.5 left-2 font-bold drop-shadow flex items-center gap-0.5">
              <span>${fertBadges}</span>
              <span class="${gradeInfo.badgeColor} text-[8px] px-1 rounded font-black">${gradeInfo.grade}</span>
            </div>
            <div class="text-sm absolute bottom-7 right-1.5 drop-shadow z-10">${pestWeedBadges}</div>
            <div class="text-3xl sm:text-5xl ${animClass} my-0.5">${stageEmoji}</div>
            
            <!-- 成長ゲージ -->
            <div class="w-4/5 bg-black/50 h-1.5 rounded-full overflow-hidden mt-1 border border-white/20">
              <div class="h-full transition-all duration-300 ${progress >= 1 ? 'bg-amber-400' : 'bg-emerald-400'}" style="width: ${percent}%"></div>
            </div>

            <!-- 水分ゲージ（成長中のみ表示） -->
            ${progress < 1 ? `
              <div class="w-4/5 bg-black/50 h-1.5 rounded-full overflow-hidden mt-1 border border-white/20 flex items-center" title="Water: ${waterPct}%">
                <div class="h-full transition-all duration-300 ${waterColor}" style="width: ${waterPct}%"></div>
              </div>
              <span class="text-[9px] text-white font-bold mt-0.5 drop-shadow">
                🌱${percent}% 💧${waterPct}% 🌿${Math.round(plot.nutrients ?? 80)}%
              </span>
            ` : `
              <span class="text-[10px] text-amber-200 font-black mt-1 drop-shadow">
                ${isVisiting ? '✨ RIPE!' : `${t('tapHarvest')} (${getSellPriceWithBonuses(crop, plot)}🪙)`}
              </span>
            `}
          `;
        }

        gridEl.appendChild(cell);
      });
    }

    function renderAll() {
      applyTranslations();
      document.getElementById('coin-display').textContent = gameState.coins.toLocaleString();

      const lvlInfo = getFarmerLevelInfo(gameState.exp || 0);
      document.getElementById('level-display').textContent = lvlInfo.level;
      document.getElementById('exp-text').textContent = `${lvlInfo.currentExp}/${lvlInfo.nextLevelExp}`;
      document.getElementById('exp-bar').style.width = `${lvlInfo.percent}%`;

      renderTools();
      renderShop();
      renderStats();
      renderLeaderboard();
      renderFriends();
      renderFarm();
    }

    // 毎秒の更新ループ（作物の成長・水分減少・枯死＆天気チェック）
    setInterval(() => {
      updateWeatherUI();
      simulateTick();
    }, 1000);

    // 初期化
    window.setLanguage(currentLang);
    updateWeatherUI();
    initAuth();
  </script>
</body>
</html>
